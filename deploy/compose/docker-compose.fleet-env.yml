      FM_MCP_READ_MAX_ROWS: "${FM_MCP_READ_MAX_ROWS:-200}"
      FM_MCP_READ_MAX_BYTES: "${FM_MCP_READ_MAX_BYTES:-262144}"
      FM_MCP_AUTH_RETRY_AFTER_SEC: "${FM_MCP_AUTH_RETRY_AFTER_SEC:-5}"
      # OpenTelemetry standard settings; empty endpoint keeps tracing off.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_SERVICE_NAME: "${OTEL_SERVICE_NAME:-fleet-manager}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-false}"
      FM_MCP_TOOL_TIMEOUT_SEC: "${FM_MCP_TOOL_TIMEOUT_SEC:-90}"
      FM_MCP_ELICIT_TIMEOUT_SEC: "${FM_MCP_ELICIT_TIMEOUT_SEC:-120}"
      FM_MCP_SESSION_TTL_MIN: "${FM_MCP_SESSION_TTL_MIN:-60}"
      FM_MCP_MAX_SESSIONS: "${FM_MCP_MAX_SESSIONS:-500}"
      FM_MCP_STANDING_APPROVAL_TTL_MIN: "${FM_MCP_STANDING_APPROVAL_TTL_MIN:-60}"
