      FM_STREAMS_KILL_SWITCH: "${FM_STREAMS_KILL_SWITCH:-false}"
      FM_WS_STREAM_MAXLEN: "${FM_WS_STREAM_MAXLEN:-}"
      FM_WS_STREAM_TTL_MS: "${FM_WS_STREAM_TTL_MS:-}"
      # Keep a dropped subscriber's events this long so a quick reconnect gets them.
      FM_WS_RESUME_GRACE_MS: "${FM_WS_RESUME_GRACE_MS:-60000}"
      FM_WS_RESUME_MAX_EVENTS: "${FM_WS_RESUME_MAX_EVENTS:-5000}"
      FM_WS_RESUME_PROBE_MS: "${FM_WS_RESUME_PROBE_MS:-2000}"
      FM_WS_STREAM_BLOCK_MS: "${FM_WS_STREAM_BLOCK_MS:-}"
      FM_WS_STREAM_BATCH_SIZE: "${FM_WS_STREAM_BATCH_SIZE:-}"
      FM_WS_SOCKET_OPEN_TIMEOUT_MS: "${FM_WS_SOCKET_OPEN_TIMEOUT_MS:-}"
      FM_WS_SOCKET_OPEN_POLL_MS: "${FM_WS_SOCKET_OPEN_POLL_MS:-}"
