      FM_DEVICE_INGRESS_PUBLIC_WS_BASE_URL: "${FM_DEVICE_INGRESS_PUBLIC_WS_BASE_URL:-}"
      FM_NOTIFICATION_RECEIPT_SIGNING_SECRET: "${FM_NOTIFICATION_RECEIPT_SIGNING_SECRET:-}"
      FM_DEVICE_INGRESS_TRUSTED_CERT_PEM_HEADER: "${FM_DEVICE_INGRESS_TRUSTED_CERT_PEM_HEADER:-}"
      FM_DEVICE_INGRESS_WAITING_ROOM_ENABLED: "${FM_DEVICE_INGRESS_WAITING_ROOM_ENABLED:-}"
      FM_DEVICE_INGRESS_CREDENTIAL_EXPIRY_WARN_DAYS: "${FM_DEVICE_INGRESS_CREDENTIAL_EXPIRY_WARN_DAYS:-}"
      FM_DEVICE_INGRESS_SETUP_SESSION_RETENTION_DAYS: "${FM_DEVICE_INGRESS_SETUP_SESSION_RETENTION_DAYS:-}"
      FM_DEVICE_INGRESS_ROTATION_ENABLED: "${FM_DEVICE_INGRESS_ROTATION_ENABLED:-}"
      FM_DEVICE_INGRESS_ROTATION_POLL_MS: "${FM_DEVICE_INGRESS_ROTATION_POLL_MS:-}"
      FM_DEVICE_INGRESS_ROTATION_IN_FLIGHT: "${FM_DEVICE_INGRESS_ROTATION_IN_FLIGHT:-}"
      FM_DEVICE_INGRESS_ROTATION_WAIT_CAP_MINUTES: "${FM_DEVICE_INGRESS_ROTATION_WAIT_CAP_MINUTES:-}"
      FM_DEVICE_INGRESS_ROTATION_BATCH_MAX: "${FM_DEVICE_INGRESS_ROTATION_BATCH_MAX:-}"
      FM_DEVICE_INGRESS_ROTATION_SEND_TIMEOUT_MS: "${FM_DEVICE_INGRESS_ROTATION_SEND_TIMEOUT_MS:-}"
