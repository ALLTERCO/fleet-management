      fleet-manager_internalStorage__connection__host: ${FM_DB_HOST:-fleet-db}
      fleet-manager_internalStorage__connection__user: postgres
      fleet-manager_internalStorage__connection__password: ${POSTGRES_PASSWORD}
      fleet-manager_internalStorage__connection__database: fleet
      fleet-manager_observability: "${FM_OBSERVABILITY}"
      # At-rest key for integration secrets (slack/teams/telegram/OAuth);
      # JWT_SECRET signs PATs and is the legacy fallback for the encryption key.
      FM_SECRET_ENCRYPTION_KEY: "${FM_SECRET_ENCRYPTION_KEY}"
      FM_SECRET_KDF_SALT: "${FM_SECRET_KDF_SALT}"
      FM_SECRET_ENCRYPTION_KEY_ID: "${FM_SECRET_ENCRYPTION_KEY_ID:-primary}"
      FM_SECRET_ENCRYPTION_KEY_PREVIOUS: "${FM_SECRET_ENCRYPTION_KEY_PREVIOUS:-}"
      FM_SECRET_ENCRYPTION_KEY_PREVIOUS_ID: "${FM_SECRET_ENCRYPTION_KEY_PREVIOUS_ID:-previous}"
      JWT_SECRET: "${JWT_SECRET}"
      FM_JWT_KID_CURRENT: "${FM_JWT_KID_CURRENT:-}"
      FM_JWT_SECRET_PREVIOUS: "${FM_JWT_SECRET_PREVIOUS:-}"
      FM_JWT_KID_PREVIOUS: "${FM_JWT_KID_PREVIOUS:-}"
      # Phase A stability tunables.
      FM_RUNTIME_KEYS_CACHE_TTL_MS: "${FM_RUNTIME_KEYS_CACHE_TTL_MS}"
      ZITADEL_HTTP_TIMEOUT_MS: "${ZITADEL_HTTP_TIMEOUT_MS}"
      ZITADEL_LIST_PAGE_SIZE: "${ZITADEL_LIST_PAGE_SIZE}"
      ZITADEL_PAT_DEFAULT_EXPIRATION_DAYS: "${ZITADEL_PAT_DEFAULT_EXPIRATION_DAYS}"
      ZITADEL_DB_MAX_OPEN_CONNS: "${ZITADEL_DB_MAX_OPEN_CONNS:-30}"
      ZITADEL_DB_MAX_IDLE_CONNS: "${ZITADEL_DB_MAX_IDLE_CONNS:-10}"
      ZITADEL_PASSWORD_HASH_ALGORITHM: "${ZITADEL_PASSWORD_HASH_ALGORITHM:-bcrypt}"
      ZITADEL_PASSWORD_HASH_COST: "${ZITADEL_PASSWORD_HASH_COST:-12}"
      # Shared Redis runtime — single source of truth.
      FM_REDIS_URL: "${FM_REDIS_URL:-redis://fm-default:${REDIS_FM_PASSWORD}@redis:6379}"
      FM_REDIS_DISABLED: "${FM_REDIS_DISABLED:-false}"
      FM_REDIS_KEY_PREFIX: "${FM_REDIS_KEY_PREFIX:-fm}"
      FM_REDIS_WRITE_MAX_PENDING_COMMANDS: "${FM_REDIS_WRITE_MAX_PENDING_COMMANDS:-512}"
      FM_AUTHZ_L1_MAX_ENTRIES: "${FM_AUTHZ_L1_MAX_ENTRIES}"
      FM_AUTHZ_L1_TTL_SECONDS: "${FM_AUTHZ_L1_TTL_SECONDS}"
      FM_AUTHZ_L2_TTL_SECONDS: "${FM_AUTHZ_L2_TTL_SECONDS}"
      FM_AUTHZ_REDIS_KEY_PREFIX: "${FM_AUTHZ_REDIS_KEY_PREFIX}"
      FM_AUTHZ_PUBSUB_CHANNEL_PREFIX: "${FM_AUTHZ_PUBSUB_CHANNEL_PREFIX}"
      FM_AUTHZ_GROUP_DEPTH_MAX: "${FM_AUTHZ_GROUP_DEPTH_MAX}"
      FM_AUTHZ_UNUSED_THRESHOLD_DAYS: "${FM_AUTHZ_UNUSED_THRESHOLD_DAYS}"
      FM_SCOPED_PAT_RETENTION_DAYS: "${FM_SCOPED_PAT_RETENTION_DAYS}"
      FM_SCOPED_PAT_SWEEP_INTERVAL_MS: "${FM_SCOPED_PAT_SWEEP_INTERVAL_MS}"
      FM_MCP_ALLOWED_CLIENTS: "${FM_MCP_ALLOWED_CLIENTS:-}"
      FM_MCP_READS_PER_MIN: "${FM_MCP_READS_PER_MIN:-600}"
