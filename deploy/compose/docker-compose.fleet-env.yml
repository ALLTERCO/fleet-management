# The fleet-manager environment, one list for every build.
# docker-compose.fleet.yml (private, built from source) and
# docker-compose.fleet-image.yml (public, Docker Hub image) both extend this
# service and add only what differs. Compose never starts a service from
# here: the file is read through `extends`, not passed with -f.
services:
  fleet-manager:
    environment:
      NODE_OPTIONS: "--max-old-space-size=${FM_HEAP_SIZE}"
      FM_LOCAL_WS_PORT: "${FM_LOCAL_WS_PORT:-}"
      FM_NODE_RED_ENABLED: "${FM_NODE_RED_ENABLED:-false}"
      FM_NODE_RED_SESSION_ALLOWED_ORIGINS: "${FM_NODE_RED_SESSION_ALLOWED_ORIGINS:-}"
      FM_NODE_RED_SESSION_COOKIE_SAMESITE: "${FM_NODE_RED_SESSION_COOKIE_SAMESITE:-strict}"
      FM_NODE_RED_SESSION_TTL_MS: "${FM_NODE_RED_SESSION_TTL_MS:-180000}"
      FM_NODE_RED_SESSION_MAX_AGE_MS: "${FM_NODE_RED_SESSION_MAX_AGE_MS:-43200000}"
      FM_NODE_RED_WS_KEEPALIVE_MS: "${FM_NODE_RED_WS_KEEPALIVE_MS:-30000}"
      FM_NODE_RED_FLOW_CACHE_MS: "${FM_NODE_RED_FLOW_CACHE_MS:-10000}"
      FM_NODE_RED_STATUS_TIMEOUT_MS: "${FM_NODE_RED_STATUS_TIMEOUT_MS:-3000}"
      FM_NODE_RED_STATUS_CACHE_MS: "${FM_NODE_RED_STATUS_CACHE_MS:-15000}"
      FM_NODE_RED_HOOK_BODY_LIMIT_BYTES: "${FM_NODE_RED_HOOK_BODY_LIMIT_BYTES:-262144}"
      FM_NODE_RED_HOOK_RATE_LIMIT_PER_MIN: "${FM_NODE_RED_HOOK_RATE_LIMIT_PER_MIN:-60}"
      FM_DEVICE_GUI_ENABLED: "${FM_DEVICE_GUI_ENABLED:-false}"
      FM_DEVICE_GUI_SESSION_TTL_SEC: "${FM_DEVICE_GUI_SESSION_TTL_SEC:-600}"
      FM_DEVICE_GUI_CONNECT_TIMEOUT_MS: "${FM_DEVICE_GUI_CONNECT_TIMEOUT_MS:-5000}"
      FM_DEVICE_GUI_REQUEST_TIMEOUT_MS: "${FM_DEVICE_GUI_REQUEST_TIMEOUT_MS:-60000}"
      FM_STATUS_REDIS_SHADOW: "${FM_STATUS_REDIS_SHADOW:-false}"
      FM_STATUS_REDIS_FIRST: "${FM_STATUS_REDIS_FIRST:-false}"
      FM_DEVICE_SNAPSHOT_REDIS_SHADOW: "${FM_DEVICE_SNAPSHOT_REDIS_SHADOW:-false}"
      FM_DEVICE_SNAPSHOT_REDIS_FIRST: "${FM_DEVICE_SNAPSHOT_REDIS_FIRST:-false}"
      FM_PERSIST_ROUTINE_DEBOUNCE_MS: "${FM_PERSIST_ROUTINE_DEBOUNCE_MS:-}"
      FM_HTTP_KEEP_ALIVE_TIMEOUT_MS: "${FM_HTTP_KEEP_ALIVE_TIMEOUT_MS:-}"
      FM_DEVICE_SNAPSHOT_DRAINER_BATCH_SIZE: "${FM_DEVICE_SNAPSHOT_DRAINER_BATCH_SIZE:-100}"
      FM_DEVICE_SNAPSHOT_DRAINER_BATCH_WINDOW_MS: "${FM_DEVICE_SNAPSHOT_DRAINER_BATCH_WINDOW_MS:-250}"
      FM_SENSOR_CAPTURE_REDIS_FIRST: "${FM_SENSOR_CAPTURE_REDIS_FIRST:-false}"
      FM_SENSOR_CAPTURE_STREAM_KEY: "${FM_SENSOR_CAPTURE_STREAM_KEY:-fm:sensor-capture}"
      FM_DEVICE_EVENTS_REDIS_SHADOW: "${FM_DEVICE_EVENTS_REDIS_SHADOW:-false}"
      FM_DEVICE_EVENTS_REDIS_FIRST: "${FM_DEVICE_EVENTS_REDIS_FIRST:-false}"
      FM_BLU_RECONCILE_CONCURRENCY: "${FM_BLU_RECONCILE_CONCURRENCY:-0}"
      FM_BLU_RECONCILE_QUEUE_MAX: "${FM_BLU_RECONCILE_QUEUE_MAX:-20000}"
      FM_BLU_TELEMETRY_FAILOVER_MS: "${FM_BLU_TELEMETRY_FAILOVER_MS:-60000}"
      FM_BLU_TELEMETRY_OWNER_MAX_ENTRIES: "${FM_BLU_TELEMETRY_OWNER_MAX_ENTRIES:-100000}"
