# Fleet Manager application — pulled from Docker Hub
#
# Used by deploy-public.sh for community deployments.
# Same as docker-compose.fleet.yml but uses a pre-built image instead of
# building from source.

services:
  redis:
    image: redis:${REDIS_VERSION:-7.4.11-alpine}
    container_name: fm-redis
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      fleet.managed_by: "${FM_MANAGED_BY:-fleet-manager}"
      fleet.client: "${FM_CLIENT_ID:-shared}"
      fleet.environment: "${FM_ENVIRONMENT_ID:-unknown}"
      fleet.mode: "${FM_TOPOLOGY_MODE:-single-tenant}"
      fleet.version: "${REDIS_VERSION:-7.4.11-alpine}"
      fleet.commit: "${FM_BUILD_COMMIT:-unknown}"
      fleet.compose_project: "${FM_COMPOSE_PROJECT_NAME:-unknown}"
      fleet.service: "redis"
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAX_MEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-noeviction}
      - --appendonly
      - ${REDIS_APPENDONLY:-no}
      - --appendfsync
      - ${REDIS_APPENDFSYNC:-everysec}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
      - redis-data:/data
    networks:
      - fleet-net

  fleet-manager:
    extends:
      file: docker-compose.fleet-env.yml
      service: fleet-manager
    image: ${DOCKER_HUB_IMAGE:-shellygroup/fleet-management}:${FM_VERSION:-latest}
    labels:
      fleet.managed_by: "${FM_MANAGED_BY:-fleet-manager}"
      fleet.client: "${FM_CLIENT_ID:-shared}"
      fleet.environment: "${FM_ENVIRONMENT_ID:-unknown}"
      fleet.mode: "${FM_TOPOLOGY_MODE:-single-tenant}"
      fleet.version: "${FM_VERSION:-unknown}"
      fleet.commit: "${FM_BUILD_COMMIT:-unknown}"
      fleet.compose_project: "${FM_COMPOSE_PROJECT_NAME:-unknown}"
      fleet.service: "fleet-manager"
    env_file:
      - path: ../state/fm-runtime.env
        required: false
    environment:
      # Shared list: docker-compose.fleet-env.yml. Only public differences here.
      FM_DEV_MODE: "${FM_DEV_MODE:-false}"
    volumes:
      - fm-backend-cfg-v:/app/backend/cfg/
      - fm-backend-plugins-v:/app/plugins
      - fm-backend-uploads-v:/app/backend/uploads
      - fm-backend-data-v:/app/backend/data
      # Local CA for selfsigned mode — entrypoint installs ca.crt and exports
      # NODE_EXTRA_CA_CERTS so Zitadel introspection over self-signed succeeds.
      - ../state/tls:/app/state/tls:ro
      # OIDC introspection + service-user key files — populated by
      # bootstrap-zitadel.sh when FM_OIDC_AUTH_METHOD=jwt-profile.
      - ../state/secrets:/app/state/secrets:ro
      # Deploy manifest — read-only. FM cwd is /app/backend, and it reads
      # deploy/state/manifest.json relative to that, so mount under /app/backend.
      - ../state/contract:/app/backend/deploy/state:ro
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /app/backend/logs:size=32M
    stop_grace_period: 30s
    networks:
      fleet-net: {}
      # Traefik reaches the app only by this name, so its peer address is
      # always in FM_EDGE_SUBNET.
      fleet-edge:
        aliases:
          - fleet-manager-edge
    depends_on:
      fleet-db:
        condition: "service_healthy"
      redis:
        condition: "service_healthy"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7011/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  fleet-net:
    labels:
      fleet.managed_by: "${FM_MANAGED_BY:-fleet-manager}"
      fleet.client: "${FM_CLIENT_ID:-shared}"
      fleet.environment: "${FM_ENVIRONMENT_ID:-unknown}"
      fleet.mode: "${FM_TOPOLOGY_MODE:-single-tenant}"
      fleet.compose_project: "${FM_COMPOSE_PROJECT_NAME:-unknown}"
      fleet.resource_type: "network"

volumes:
  fm-backend-cfg-v:
    labels: &fm-image-volume-labels
      fleet.managed_by: "${FM_MANAGED_BY:-fleet-manager}"
      fleet.client: "${FM_CLIENT_ID:-shared}"
      fleet.environment: "${FM_ENVIRONMENT_ID:-unknown}"
      fleet.mode: "${FM_TOPOLOGY_MODE:-single-tenant}"
      fleet.compose_project: "${FM_COMPOSE_PROJECT_NAME:-unknown}"
      fleet.resource_type: "volume"
      fleet.service: "fleet-manager"
  fm-backend-plugins-v:
    labels: *fm-image-volume-labels
  fm-backend-uploads-v:
    labels: *fm-image-volume-labels
  fm-backend-data-v:
    labels: *fm-image-volume-labels
  redis-data:
    labels:
      fleet.managed_by: "${FM_MANAGED_BY:-fleet-manager}"
      fleet.client: "${FM_CLIENT_ID:-shared}"
      fleet.environment: "${FM_ENVIRONMENT_ID:-unknown}"
      fleet.mode: "${FM_TOPOLOGY_MODE:-single-tenant}"
      fleet.compose_project: "${FM_COMPOSE_PROJECT_NAME:-unknown}"
      fleet.resource_type: "volume"
      fleet.service: "redis"
